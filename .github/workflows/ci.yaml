name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create test package
        uses: secondlife/action-nfpm@v2
      - uses: ./
        id: debserver
        with:
          path: dist
      - name: Check output
        env:
          PORT: ${{ steps.debserver.outputs.port }}
        run: |
          fatal() {
            echo "$@" > /dev/stderr
            exit 1
          }
          test -f dist/Packages || fatal "Missing dist/Packages"
          test -f dist/Packages.gz || fatal "Missing dist/Packages.gz"
          test -f dist/Packages.bz2 || fatal "Missing dist/Packages.bz2"
          curl -sf http://localhost:$PORT/Packages || fatal "Unable to cURL http://localhost:$PORT/Packages"
